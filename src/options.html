<body>
  <h3>Trustpilot Region</h3>
  <label for="locale">Select Trustpilot Region:</label>
  <select id="locale">
    <optgroup label="Global & North America">
      <option value="www.trustpilot.com">Global / USA (.com)</option>
      <option value="ca.trustpilot.com">Canada (.ca)</option>
    </optgroup>

    <optgroup label="Europe">
      <option value="at.trustpilot.com">Austria (.at)</option>
      <option value="be.trustpilot.com">Belgium (.be)</option>
      <option value="dk.trustpilot.com">Denmark (.dk)</option>
      <option value="fi.trustpilot.com">Finland (.fi)</option>
      <option value="fr.trustpilot.com">France (.fr)</option>
      <option value="de.trustpilot.com">Germany (.de)</option>
      <option value="ie.trustpilot.com">Ireland (.ie)</option>
      <option value="it.trustpilot.com">Italy (.it)</option>
      <option value="nl.trustpilot.com">Netherlands (.nl)</option>
      <option value="no.trustpilot.com">Norway (.no)</option>
      <option value="pl.trustpilot.com">Poland (.pl)</option>
      <option value="pt.trustpilot.com">Portugal (.pt)</option>
      <option value="es.trustpilot.com">Spain (.es)</option>
      <option value="se.trustpilot.com">Sweden (.se)</option>
      <option value="ch.trustpilot.com">Switzerland (.ch)</option>
      <option value="uk.trustpilot.com">United Kingdom (.co.uk)</option>
    </optgroup>

    <optgroup label="Oceania & Asia">
      <option value="au.trustpilot.com">Australia (.com.au)</option>
      <option value="nz.trustpilot.com">New Zealand (.nz)</option>
      <option value="jp.trustpilot.com">Japan (.jp)</option>
    </optgroup>

    <optgroup label="Other Regions">
      <option value="br.trustpilot.com">Brazil (.br)</option>
    </optgroup>
  </select>
  <div class="settings-row">
    <button id="save">Save Settings</button>
    <span id="status"
      style="margin-left: 10px; color: #00b67a; font-weight: bold; opacity: 0; transition: opacity 0.3s ease;"></span>
  </div>
  <script type="module" src="options.js"></script>
</body>
